<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — CivicPulse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0f1e 0%, #003366 50%, #0a0f1e 100%);
      color: #fff;
      padding: 24px;
      text-align: center;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }

    .icon-wrap svg {
      width: 48px;
      height: 48px;
      stroke: #06b6d4;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: #06b6d4;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    p {
      font-size: 1rem;
      color: rgba(255,255,255,0.65);
      max-width: 340px;
      margin: 0 auto 32px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:active { opacity: 0.8; }

    .btn-primary {
      background: #06b6d4;
      color: #fff;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .tip {
      margin-top: 40px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.35);
    }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">CivicPulse</span>
  </div>

  <div class="icon-wrap">
    <svg viewBox="0 0 24 24">
      <path d="M1 6l10.07 5.293a2 2 0 001.86 0L23 6"/>
      <rect x="1" y="4" width="22" height="16" rx="3"/>
      <line x1="1" y1="20" x2="23" y2="4"/>
    </svg>
  </div>

  <h1>You're Offline</h1>
  <p>No internet connection detected. Check your Wi-Fi or mobile data, then try again.</p>

  <div class="actions">
    <button class="btn btn-primary" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 4v6h-6"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
      Try Again
    </button>
    <a href="/dashboard" class="btn btn-secondary">Go to Dashboard</a>
  </div>

  <p class="tip">Previously visited pages may still be available while offline.</p>
</body>
</html>
